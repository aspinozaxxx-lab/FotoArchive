[project]
name = "fotoarchive"
version = "0.7.1"
description = "Local Windows photo catalog with AMD GPU semantic search"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6", "Pillow", "numpy", "onnxruntime-directml", "lancedb", "pyarrow", "tokenizers", "huggingface-hub", "requests", "psutil", "truststore", "filelock", "opencv-python-headless", "rawpy==0.27.1", "pillow-heif==1.7.0", "ExifRead==3.5.1", "av==18.1.0", "psd-tools==1.19.0"]

[project.scripts]
fotoarchive = "fotoarchive.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
